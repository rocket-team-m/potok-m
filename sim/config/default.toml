[output]
mode = "both"
# Feature vector consumed by the AI model (window 50 x 8).
features = ["gyro_x", "gyro_y", "gyro_z", "acc_x", "acc_y", "acc_z", "baro_h", "pitot_q"]
# false writes classic v2 (17 metadata floats). true appends 22 truth floats
# (true wind, gust, shear and the full 6-DoF state) as v2 metadata (39 total).
truth_metadata = false

# --- Optional fin servo (measurement-backed, OFF by default) -----------------
# The shipped simulator has NO measured servo step response, so fin commands are
# applied by the ideal instantaneous fin. To remove that ideal-fin bias, a caller
# builds `identification::ServoStepResponse` from its own step-test samples and
# installs it with `Vehicle::with_servo(response, dt)`. The three fields below
# are the response's identified parameters; they are documented here so a future
# measured config has a named home. They are NOT read by `Config` today: no
# measurement ships with the crate, and an absent measurement must never be
# silently replaced by a made-up servo. `ServoActuator::new` validates all three
# LOUD (SimError::Config names the field, value and fix) before use.
#
# [servo]
# delay_s = 0.02       # pure transport delay before any fin motion, s (>= 0)
# rate_per_s = 0.5     # maximum fin slew, rad/s (> 0), from the step response
# deadband = 0.001     # |deflection demand| <= this produces no motion (>= 0)

# --- Optional two-stage recovery canopy (CHUTE01, opt-in) -------------------
# OFF by default: the shipped fin-flight trajectory and every existing A/B are
# bit-identical when this section is left at `enabled = false`. When enabled,
# a spring-ejected drogue fires on post-apogee descent confirmation and a
# spring-ejected main fires at 1500 m AGL. There is NO pyro channel and NO AI
# authority under canopy; descent relaxes to the target rate and horizontal
# motion follows the TRUE wind. See sim/docs/PARACHUTE.md for the wiring.
# A canopy flight needs a longer run.duration_s than the 30 s fin-flight
# default for the landing event to occur.
[parachute]
enabled = false
require_descent_confirm = true
wind_coupling_s = 3.0        # s, canopy -> true-wind first-order coupling
landing_altitude_m = 0.0      # m AGL, one-shot landing event

[parachute.drogue]
trigger = { kind = "time_since_apogee", value = 2.0 }
target_descent_mps = 25.0    # m/s, settled drogue descent
inflation_s = 1.2            # s, inflation / descent relaxation time constant

[parachute.main]
trigger = { kind = "altitude_m", value = 1500.0 }
target_descent_mps = 6.5     # m/s, settled main descent (must be < drogue)
inflation_s = 2.0            # s, inflation / descent relaxation time constant
