# Deterministic Potok-M simulation defaults. Every randomized quantity is
# derived from `run.seed` and the episode index; there is no global RNG.
# See sim/README.md "Source of default numbers" for the provenance table.

[run]
seed = 1337
duration_s = 30.0
dt = 0.002
frame_rate_hz = 50.0
episodes = 1
# false = exact analytic wind profile (reference); true = grid lookup.
fast_field = true

[sim]
boundary_profile = "config/boundary_profile.csv"
altitude_grid_m = 10.0
# false = dynamics only (no sensor frames, used by the throughput benchmark).
sensors = true

[wind]
# Launch-day winds are TTX assumptions, not passport values. Reduced from the
# earlier 8/6 m/s so the wind does not turn the vehicle far off vertical.
v_10 = 3.0
shear_exponent = 0.22
shear_delta = 2.0          # m/s jump across the layer
shear_thickness = 12.0     # m
shear_altitude = 150.0     # m
direction_deg = 25.0
gust_probability = 0.2
gust_amplitude = 9.0       # m/s
gust_duration = 2.0        # s
turbulence_sigma = 0.6     # m/s per axis
turbulence_scale = 60.0    # m, integral scale

[initial]
# User-stated TTX: ~13 kg lift-off mass.
mass_kg = [12.5, 13.5]
cg_offset_m = [-0.02, 0.02]
thrust_scale = [0.94, 1.06]
pitch_deg = [-2.0, 2.0]
yaw_deg = [-2.0, 2.0]
gimbal_deg = [-0.8, 0.8]

[sensor]
# DELTA report: 1064 ug = 0.0104 m/s^2 -> 0.011 m/s^2.
gyro_noise = 0.0015        # rad/s, kept at the previously validated value
gyro_bias = [0.002, -0.001, 0.0005]
accel_noise = 0.011        # m/s^2, DELTA report 1064 ug
accel_bias = [0.02, -0.015, 0.01]
mag_noise = 0.02
mag_bias = [0.01, -0.01, 0.005]
mag_world = [0.22, 0.08, 0.38]
baro_noise = 0.35
baro_bias = -0.4
pitot_noise = 25.0
pitot_bias = -8.0
lag_tau = 0.012
quant_step = 0.0005
gyro_sat = 12.0
accel_sat = 250.0
pitot_sat = 30000.0

# Allan-variance instrument model. 0 (the default) keeps the legacy
# white-noise + constant-bias model and its RNG draw order unchanged. ARW is
# a density (rad/s/sqrt(Hz), m/s^2/sqrt(Hz)); the discrete std is arw/sqrt(dt).
# Bias stability drives a seeded random walk on top of the constant bias.
gyro_arw = 0.0
gyro_bias_stability = 0.0
accel_arw = 0.0
accel_bias_stability = 0.0
# Other non-ideal effects; all 0/off by default for legacy behaviour.
# Whole-frame measurement delay (frames) on gyro/accel/mag/baro/pitot.
latency_steps = 0
# Per-channel quantization; 0 means "use quant_step above".
gyro_quant_step = 0.0
accel_quant_step = 0.0
# Extra saturation limits; 0 means "no limit".
mag_sat = 0.0
baro_sat = 0.0
# Per-frame seeded spike injection (probability, magnitude).
spike_probability = 0.0
spike_amplitude = 0.0

[aero]
# User-stated TTX: diameter 0.102 m -> A = pi*(0.102/2)^2 = 0.00817 m^2.
area_m2 = 0.00817
# "placeholder" (default) uses the analytic coefficients below and prints a
# COUNTED marker. "card" loads the 2-D (Mach, alpha) grid named by card_path;
# out-of-grid queries are a LOUD error. config/aero_card.toml is generated
# from these placeholder values and reproduces them when selected.
source = "placeholder"
# card_path = "config/aero_card.toml"
# PLACEHOLDER aero coefficients (NOT from the real Potok-M aero model):
# cd0, cna, pitch_damping, roll_damping and the cd_mach table are estimates.
# Their uncertainty is unquantified; a real OpenRocket/Ansys card would replace
# them. Only area and static margin below are user-stated physical values.
cd0 = 0.35
cna = 1.8
# TTX: 0.75 cal * 0.102 m = 0.0765 m.
static_margin_m = 0.0765
pitch_damping = 0.6
roll_damping = 0.25
cd_mach = [[0.0, 0.35], [0.4, 0.35], [0.7, 0.39], [0.9, 0.48], [1.1, 0.52], [1.5, 0.40]]
# Motor passports (chat PDFs):
#   stage 1 RDK-2000: 2.2-2.4 kNs, avg 390-400 N, peak 500-550 N,
#     burn 5-6 s, propellant 1.88 kg.
#   stage 2 RDK-1000: 1.0-1.2 kNs, avg 260-270 N, peak 550-600 N,
#     burn 3-3.5 s, propellant 1.0 kg.
# Motor passports: 2.2 + 1.0 kNs minimum (400 N for 5.5 s and 312.5 N for
# 3.2 s), both below the passport peak thrusts.
# Mass flows 0.342 / 0.3125 kg/s are the passport propellant masses divided
# by the burn times. Peaks and thrust ripple are NOT modelled; only average
# thrust and mass flow are.
thrust_profile = [
  [0.0, 0.0, 0.0],
  [0.08, 400.0, 0.342],
  [5.5, 400.0, 0.342],
  [5.5, 312.5, 0.3125],
  [8.7, 312.5, 0.3125],
  [8.7, 0.0, 0.0],
  [30.0, 0.0, 0.0],
]

[output]
mode = "both"
# Feature vector consumed by the AI model (window 50 x 8).
features = ["gyro_x", "gyro_y", "gyro_z", "acc_x", "acc_y", "acc_z", "baro_h", "pitot_q"]
# false writes classic v2 (17 metadata floats). true appends 22 truth floats
# (true wind, gust, shear and the full 6-DoF state) as v2 metadata (39 total).
truth_metadata = false
