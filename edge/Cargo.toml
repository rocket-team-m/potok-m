[package]
name = "potok-edge"
version = "0.1.0"
edition = "2021"
description = "Fixed-size CPU inference service for the Potok-M assist control loop"
license = "MIT"

# No workspace join: sim/, ai/, protocol/ are owned by other agents.
# This crate is self-contained and builds with plain `cargo test` / `cargo check`.

[dependencies]
sha2 = "0.10"
serialport = "4"
potok-protocol = { path = "../protocol/potok-protocol" }

[lib]
name = "potok_edge"
path = "src/lib.rs"

[[bin]]
name = "infer"
path = "src/bin/infer.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "make-fixture"
path = "src/bin/make_fixture.rs"

[[bin]]
name = "bench-spec"
path = "src/bin/bench_spec.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
