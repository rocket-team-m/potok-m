[project]
name = "potok-ai"
version = "0.1.0"
description = "ИИ-стек «Поток-М»: модель, обучение, симулятор, обработка телеметрии"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
