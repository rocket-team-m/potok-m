[package]
name = "potok-train-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Training-run monitor and deterministic SVG report generator for Potok-M"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "std", "underline-color"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plotters = "0.3"

[dev-dependencies]
