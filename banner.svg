<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Поток-М: ИИ-стек">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1018"/>
      <stop offset="0.55" stop-color="#0d1622"/>
      <stop offset="1" stop-color="#111b28"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1b2736" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="300" fill="#22d3ee"/>

  <g fill="none" stroke-linecap="round">
    <path d="M560 218 C660 150 720 258 820 186 S980 132 1160 176" stroke="url(#wave)" stroke-width="2.5"/>
    <path d="M560 248 C660 180 720 288 820 216 S980 162 1160 206" stroke="#22d3ee" stroke-width="1.5" opacity="0.28"/>
    <path d="M700 270 Q900 120 1032 104" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 9" opacity="0.4"/>
  </g>

  <g filter="url(#glow)" opacity="0.95">
    <path d="M1032 46 C1046 68 1046 90 1032 106 C1018 90 1018 68 1032 46 Z" fill="#0d1622" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="1032" cy="72" r="4.5" fill="#22d3ee"/>
    <path d="M1018 88 L1004 108 L1018 102 M1046 88 L1060 108 L1046 102" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M1026 106 L1032 126 L1038 106 Z" fill="#22d3ee" opacity="0.7"/>
  </g>

  <text x="56" y="132" font-family="'DejaVu Sans','Arial',sans-serif" font-size="54" font-weight="700" fill="#f2f6fb" letter-spacing="1">ПОТОК-М: ИИ</text>
  <rect x="58" y="154" width="74" height="4" fill="#22d3ee"/>
  <text x="56" y="196" font-family="'DejaVu Sans','Arial',sans-serif" font-size="20" fill="#22d3ee" opacity="0.92">Обучение · дистилляция · экспорт модели</text>
  <text x="56" y="248" font-family="'DejaVu Sans','Arial',sans-serif" font-size="14" fill="#7d8ea3" letter-spacing="2">rocket-team-m / potok-m-ai</text>
</svg>
