name: AI

on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - '.github/workflows/ai.yml'
  pull_request:
    paths:
      - 'ai/**'
      - '.github/workflows/ai.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
