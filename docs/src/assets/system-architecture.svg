  <rect x="650" y="378" width="318" height="70" rx="3" fill="#f5f7fb" stroke="#d7dce5"/>
  <text x="664" y="398" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0f172a">POTOKM1 / POTOKM3</text>
  <text x="664" y="417" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">бинарный экспорт, хвост SHA-256</text>
  <rect x="356" y="378" width="270" height="70" rx="3" fill="#f5f7fb" stroke="#d7dce5"/>
  <text x="370" y="398" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0f172a">potok-m-edge</text>
  <text x="370" y="417" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">Raspberry Pi 4 B, запросы 50 Гц</text>
  <rect x="32" y="378" width="300" height="70" rx="3" fill="#f5f7fb" stroke="#d7dce5"/>
  <text x="46" y="398" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0f172a">potok-m-protocol</text>
  <text x="46" y="417" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">UART-кадр: запрос 56 B / ответ 14 B</text>
