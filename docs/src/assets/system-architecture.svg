  <rect x="32" y="492" width="440" height="72" rx="3" fill="#f5f7fb" stroke="#d7dce5"/>
  <text x="46" y="512" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0f172a">potok-m-firmware · STM32H743</text>
  <text x="46" y="531" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">контур 500 Гц, ПИД, интерлоки, спасение</text>
  <rect x="496" y="492" width="472" height="72" rx="3" fill="#f5f7fb" stroke="#d7dce5"/>
  <text x="510" y="512" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0f172a">журнал полёта → разбор → обучение</text>
  <text x="510" y="531" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">реальных лётных логов нет; ИИ — наблюдатель</text>
