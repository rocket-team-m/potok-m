  <text x="370" y="279" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">validation.bin + POTOKTRJ</text>
  <text x="370" y="298" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">80 train / 20 held-out</text>
  <rect x="650" y="242" width="318" height="76" rx="3" fill="#f5f7fb" stroke="#d7dce5"/>
  <text x="664" y="262" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0f172a">potok-m-ai</text>
