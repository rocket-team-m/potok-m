  <text x="664" y="128" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0f172a">potok-m</text>
  <text x="664" y="147" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">ADR, спецификации, этот сайт</text>
  <text x="32" y="232" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#3457d5">ДАННЫЕ И МОДЕЛЬ</text>
  <rect x="32" y="242" width="300" height="76" rx="3" fill="#f5f7fb" stroke="#d7dce5"/>
  <text x="46" y="260" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0f172a">potok-m-sim</text>
  <text x="46" y="279" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">6-DoF, ветер, датчики</text>
  <text x="46" y="298" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">рандомизация в допусках</text>
