<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Архитектура систем и поток данных">
  <title>Архитектура систем и поток данных</title>
  <rect width="1000" height="600" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="999" height="599" fill="none" stroke="#d7dce5"/>
  <text x="32" y="46" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#0f172a">Архитектура систем и поток данных</text>
  <text x="32" y="70" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#475569">Публичные репозитории и приватный RocketCraft; стрелки — направление потока</text>
  <text x="32" y="98" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#3457d5">ПРОЕКТИРОВАНИЕ</text>
  <rect x="32" y="108" width="300" height="70" rx="3" fill="#f5f7fb" stroke="#d7dce5"/>
  <text x="46" y="128" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0f172a">RocketCraft · приватный</text>
  <text x="46" y="147" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">CAD → mesh → CFD/FEA → аэрокарточка</text>
  <rect x="356" y="108" width="270" height="70" rx="3" fill="#f5f7fb" stroke="#d7dce5"/>
  <text x="370" y="128" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0f172a">potok-m-3d</text>
  <text x="370" y="147" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#475569">текстовые CAD-входы, STEP/STL</text>
